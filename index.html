<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- title, description, canonical e Open Graph são definidos por página via <Head> (vite-react-ssg) -->
    <meta name="author" content="Morelli Engenharia e Assessoria" />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="Morelli Engenharia" />
    <meta property="og:locale" content="pt_BR" />
    
    <!-- Schema.org Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Morelli Engenharia e Assessoria em Segurança do Trabalho",
      "alternateName": "Morelli Engenharia",
      "url": "https://morelliengenharia.com.br",
      "logo": "https://morelliengenharia.com.br/og-image.jpg",
      "description": "Engenharia e Assessoria em Segurança do Trabalho. PGR, PCMSO, Laudos Técnicos, Treinamentos NR e SESMT Terceirizado.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "BR"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+55-12-3922-6658",
        "contactType": "customer service",
        "areaServed": "BR",
        "availableLanguage": "Portuguese"
      },
      "sameAs": []
    }
    </script>
    
    <!-- Schema.org WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Morelli Engenharia",
      "url": "https://morelliengenharia.com.br",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://morelliengenharia.com.br/blog?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
